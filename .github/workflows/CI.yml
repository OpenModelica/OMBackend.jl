name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - "1.13"
    tags: '*'
  schedule:
    # Nightly run against master at 03:17 UTC. The odd minute avoids the
    # top-of-the-hour queue spike on GitHub-hosted runners.
    - cron: '17 3 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Every julia invocation picks up OMBackend.jl as the active project so the
  # cache action and the build/test actions all key off the same Manifest.
  JULIA_PROJECT: OMBackend.jl

jobs:
  test:
    name: Julia ${{ matrix.version }} - ${{ matrix.os }} - ${{ matrix.arch }} - ${{ matrix.group }} - ${{ github.event_name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    env:
      # the nightly failure mail needs both mail secrets (not set: GitHub's own notification)
      MAIL_CONFIGURED: ${{ secrets.MAIL_USERNAME != '' && secrets.MAIL_PASSWORD != '' }}
      # the depot cache's name: one per OS, arch and Julia version (the Linux shards share theirs)
      DEPOT_CACHE_NAME: ombackend-cpu-targets;os=${{ matrix.os }};arch=${{ matrix.arch }};version=${{ matrix.version }}
    strategy:
      fail-fast: false
      # group: OMBACKEND_TEST_GROUP (test/runtests.jl). Linux runs the whole suite in two shards, one per route of the
      # array path's models: "scalarized" (with the platform tests) and "kept". macOS and Windows run "platform".
      matrix:
        include:
          - os: ubuntu-latest
            arch: x64
            version: '1.13'
            group: scalarized
          - os: ubuntu-latest
            arch: x64
            version: '1.13'
            group: kept
          - os: macos-latest
            arch: arm64
            version: '1.13'
            group: platform
          - os: windows-latest
            arch: x64
            version: '1.13'
            group: platform

    steps:
      - name: Cap precompile concurrency (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: echo "JULIA_NUM_PRECOMPILE_TASKS=2" >> "$GITHUB_ENV"

      # The x64 runners differ in CPU (AMD znver4/znver5, Intel): package images
      # compiled for the build runner's CPU (`native`) were rejected on another,
      # and the whole depot precompiled again (#108's Ubuntu run: 387 packages,
      # 28 min). The targets of Julia's own x64 binaries (doc/src/devdocs/sysimg.md;
      # its system image has them): images load on every runner, each runner uses
      # its best target. The arm64 macOS runners have one CPU: native.
      # The depot cache's name has `cpu-targets`: a cache with native images is not
      # reused. The loader accepts such an image, so Pkg does not rebuild it, but a
      # precompile worker with these targets rejects it as a dependency (#109's
      # first run: OMBackend failed to precompile).
      - name: CPU target of package images (x64)
        if: matrix.arch == 'x64'
        shell: bash
        run: echo "JULIA_CPU_TARGET=generic;sandybridge,-xsaveopt,clone_all;haswell,-rdrnd,base(1)" >> "$GITHUB_ENV"

      - name: Checkout OMBackend.jl
        uses: actions/checkout@v4
        with:
          path: OMBackend.jl

      # The shared action checks the siblings out at the branch that matches
      # this change (the PR branch if the sibling has it, else the PR base
      # branch, e.g. 1.13, else master) from the OpenModelica repositories;
      # the step after Julia's setup develops them into the project (the
      # registered package has no [sources], so the registry's versions are
      # not what is tested).
      - name: Checkout sibling OM*.jl packages
        uses: JKRT/OM.jl/.github/actions/checkout-siblings@master
        with:
          packages: ImmutableList MetaModelica OMFrontend OMParser OMRuntimeExternalC

      - name: Set up Julia ${{ matrix.version }}
        uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.version }}
          arch: ${{ matrix.arch }}

      # Master (pushes, the nightly) restores and saves the depot cache: the
      # artifact store, package store, registries and the compiled-modules
      # directory. The compiled cache is the biggest warm-run win - without it
      # precompile reruns from scratch.
      - name: Cache Julia depot
        if: github.event_name != 'pull_request'
        uses: julia-actions/cache@v2
        with:
          cache-name: ${{ env.DEPOT_CACHE_NAME }}
          include-matrix: false

      # A pull request restores master's cache and saves none: each PR run
      # saved 0.8-2.6 GB per OS, the repository went over its 10 GB and GitHub
      # evicted master's caches. The paths and the key prefix are those of
      # julia-actions/cache above (a cache is found only under the same paths).
      - name: Depot cache paths (pull request)
        if: github.event_name == 'pull_request'
        id: depot
        shell: bash
        run: |
          if [[ "$OSTYPE" == "msys" || "$OSTYPE" == "cygwin" ]]; then
            depot="${USERPROFILE//\\//}/.julia"
          else
            depot="$HOME/.julia"
          fi
          {
            echo "paths<<EOF"
            printf "%s\n" "$depot/artifacts" "$depot/packages" "$depot/registries" "$depot/compiled" \
                          "$depot/scratchspaces" "$depot/logs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "key=${DEPOT_CACHE_NAME};os=${{ runner.os }};" >> "$GITHUB_OUTPUT"

      - name: Restore Julia depot from master (pull request)
        if: github.event_name == 'pull_request'
        uses: actions/cache/restore@v4
        with:
          path: ${{ steps.depot.outputs.paths }}
          key: ${{ steps.depot.outputs.key }}
          restore-keys: ${{ steps.depot.outputs.key }}
          enableCrossOsArchive: false

      - name: Add OpenModelica Julia registry
        shell: julia --color=yes {0}
        run: |
          import Pkg
          Pkg.Registry.add("General")
          Pkg.Registry.add(Pkg.RegistrySpec(url = "https://github.com/OpenModelica/OpenModelicaRegistry.git"))
          # a restored registry is as old as its cache (julia-actions/cache updates it on master; a PR's restore does not)
          Pkg.Registry.update()

      - name: Develop the sibling checkouts
        shell: julia --color=yes --project=OMBackend.jl {0}
        run: |
          import Pkg
          Pkg.develop([Pkg.PackageSpec(path = p) for p in
                       ("ImmutableList.jl", "MetaModelica.jl", "OMFrontend.jl",
                        "OMParser.jl", "OMRuntimeExternalC.jl")])

      - name: Instantiate and build
        uses: julia-actions/julia-buildpkg@v1
        with:
          project: OMBackend.jl

      # Which of our packages the restored depot has precompiled for the test
      # run (its flags: coverage on Linux), and why a cache is rejected
      # (JULIA_DEBUG=loading: "Rejecting ... because ..."). Unchanged siblings
      # should come from the cache; OMBackend itself is rebuilt when it changed.
      - name: Precompile cache report
        shell: bash
        env:
          JULIA_DEBUG: loading
          COVERAGE_FLAG: ${{ runner.os == 'Linux' && format('--code-coverage=@{0}/OMBackend.jl', github.workspace) || '' }}
        run: |
          julia --color=yes --project=OMBackend.jl --depwarn=yes $COVERAGE_FLAG -e '
            for name in ("ImmutableList", "MetaModelica", "OMParser", "OMFrontend", "OMRuntimeExternalC", "OMBackend")
              local id = Base.identify_package(name)
              println(name, ": ", Base.isprecompiled(id; ignore_loaded = true) ? "cached" : "to precompile")
            end'

      - name: Run tests
        uses: julia-actions/julia-runtest@v1
        env:
          OMBACKEND_TEST_GROUP: ${{ matrix.group }}
        with:
          project: OMBackend.jl
          # Coverage on Linux only: the whole suite runs there (Codecov merges
          # the two shards' uploads of a commit). Coverage of a
          # path (`@OMBackend.jl`) still loads the dependencies' package images
          # from the cache (the cache report shows them on Linux).
          coverage: ${{ runner.os == 'Linux' }}
          # Use Julia's default bounds-check behavior (honor @inbounds) instead
          # of the action default --check-bounds=yes. The forced setting is a
          # separate precompile configuration, so it triggers a full pkgimage
          # rebuild of every dependency on test entry and discards the warm
          # depot cache restored above.
          check_bounds: auto

      - name: Process coverage
        if: runner.os == 'Linux'
        uses: julia-actions/julia-processcoverage@v1
        with:
          directories: OMBackend.jl/src

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v4
        # an upload problem (Codecov's service or network) must not fail the tests
        continue-on-error: true
        with:
          files: lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

      - name: Email maintainer on nightly failure
        if: ${{ failure() && github.event_name == 'schedule' && env.MAIL_CONFIGURED == 'true' }}
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          secure: true
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          from: OMBackend CI <${{ secrets.MAIL_USERNAME }}>
          to: jtinnerholm@gmail.com
          subject: "[OMBackend nightly] ${{ matrix.os }} Julia ${{ matrix.version }} FAILED"
          body: |
            The nightly CI run for OMBackend.jl failed.

            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
            Commit:       ${{ github.sha }}
            Branch:       ${{ github.ref_name }}
            Matrix:       ${{ matrix.os }} / Julia ${{ matrix.version }} / ${{ matrix.arch }}
