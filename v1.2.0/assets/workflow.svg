<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 300" width="800" height="300" role="img" aria-labelledby="t d">
  <title id="t">Translate once, simulate many times</title>
  <desc id="d">A model translated inside withTunableParameters keeps the named parameters tunable. simulate solves it once; resimulate solves it again with new parameter values and no new translation. variableValues reads a variable from each solution.</desc>
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1d3f73"/>
    </marker>
    <style>
      .label { font: 600 14px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #0f1b2d; }
      .sub { font: 12.5px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #3d4a5c; }
      .code { font: 12px "JuliaMono", "SFMono-Regular", Menlo, Consolas, monospace; fill: #1d3f73; }
      .codew { font: 12px "JuliaMono", "SFMono-Regular", Menlo, Consolas, monospace; fill: #ffffff; }
      .tag { font: 600 10.5px "Inter", "Helvetica Neue", Arial, sans-serif; fill: #1f5fbf; letter-spacing: 0.06em; }
      .box { fill: #ffffff; stroke: #1f5fbf; stroke-width: 1.5; }
      .soft { fill: #eaf1fb; stroke: #9db8e0; stroke-width: 1; }
      .dark { fill: #1d3f73; }
      .flow { stroke: #1d3f73; stroke-width: 1.6; fill: none; marker-end: url(#arrow2); }
    </style>
  </defs>
  <rect x="0" y="0" width="800" height="300" rx="12" fill="#ffffff"/>

  <text x="24" y="34" class="tag">ONCE</text>
  <text x="310" y="34" class="tag">MANY TIMES</text>

  <!-- translate inside withTunableParameters -->
  <rect x="24" y="44" width="260" height="148" rx="10" class="soft"/>
  <text x="40" y="68" class="code">withTunableParameters(["k"]) do</text>
  <rect x="40" y="80" width="228" height="56" rx="8" class="box"/>
  <text x="56" y="104" class="code">translate(...)</text>
  <text x="56" y="124" class="sub">compiles the model</text>
  <text x="40" y="156" class="code">end</text>
  <text x="40" y="178" class="sub">k stays a parameter</text>

  <!-- simulate -->
  <path d="M284,110 H306" class="flow"/>
  <rect x="310" y="80" width="190" height="60" rx="8" class="box"/>
  <text x="324" y="104" class="code">simulate(name; tspan)</text>
  <text x="324" y="126" class="sub">first solution</text>

  <!-- resimulate -->
  <path d="M500,110 H516" class="flow"/>
  <rect x="520" y="80" width="256" height="60" rx="8" class="box"/>
  <text x="534" y="104" class="code">resimulate(name;</text>
  <text x="548" y="122" class="code">parameters = Dict("k" =&gt; 2.0))</text>
  <path d="M700,140 C700,180 610,180 610,144" class="flow"/>
  <text x="560" y="194" class="sub">new values, no new translation</text>

  <!-- results -->
  <rect x="310" y="216" width="466" height="40" rx="8" class="dark"/>
  <path d="M405,140 V212" class="flow"/>
  <path d="M760,140 V212" class="flow"/>
  <text x="324" y="241" class="codew">variableValues(sol, "x")</text>
  <text x="530" y="241" class="codew">plot(sol)</text>

  <!-- notes -->
  <text x="24" y="216" class="sub">Check names:</text>
  <text x="24" y="234" class="code">isTunable(name, ["k"])</text>
  <text x="24" y="258" class="sub">Values at translation:</text>
  <text x="24" y="276" class="code">pristineParameters(name)</text>
</svg>
